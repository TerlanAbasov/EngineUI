server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (DecisionEngine)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Execution console calls to ExecutionEngine (paper-trading order execution
    # service) — separate host in the compose stack, override with a build/deploy-time
    # hostname if it differs from "execution-engine".
    location /exec-api/ {
        rewrite ^/exec-api/(.*)$ /api/v1/$1 break;
        proxy_pass http://execution-engine:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
